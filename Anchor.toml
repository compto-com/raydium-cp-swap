[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"

[workspace]
members = ["programs/cp-swap"]

[features]
resolution = true
skip-lint = false

[programs.localnet]
raydium_cp_swap = "GVSzpfu4CzCxgU7wNeNy4eCeDX6R7ecY3vKSRLuDJfu1"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn install && yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/*.test.ts"

[test]
startup_wait = 10000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
