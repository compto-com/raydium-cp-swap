[package]
name = "raydium-cp-swap"
version = "0.2.0"
description = "Compto's single-pool, fee-less constant product AMM (fork of Raydium CP-Swap)"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "raydium_cp_swap"

[features]
no-entrypoint = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
enable-log = []
devnet = []
localnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

# Feature cfgs referenced by upstream macros (anchor #[program]/#[derive(Accounts)]
# and the solana entrypoint) but not declared as our own features. Declaring them
# here silences rustc check-cfg false positives without touching code.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
] }

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = "=1.0.2"


[dev-dependencies]
proptest = "1.0"
